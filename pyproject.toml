[build-system]
requires = [
    "setuptools>=68.0",
    "wheel"
]

build-backend = "setuptools.build_meta"



[project]
name = "agentic-rag-researcher"

version = "1.0.0"

description = """
Production-grade Agentic RAG system with
routing, local document retrieval,
web search augmentation, and citation generation.
"""

authors = [
    {
        name = "Shubham"
    }
]

requires-python = ">=3.11"



dependencies = [

    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",


    # Validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",


    # Agent orchestration
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",


    # LLM
    "openai>=1.30.0",


    # Embeddings
    "sentence-transformers>=2.7.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",


    # Vector database
    "qdrant-client>=1.9.0",


    # PDF processing
    "pypdf>=4.2.0",
    "pymupdf>=1.24.0",


    # Web search
    "httpx>=0.27.0",


    # Evaluation
    "ragas>=0.1.7",
    "datasets>=2.19.0",


    # Data processing
    "pandas>=2.2.0",


    # Environment
    "python-dotenv>=1.0.0",
]



[project.optional-dependencies]


dev = [

    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",


    # Code quality
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",

]



[tool.setuptools.packages.find]

where = [
    "."
]



# --------------------------
# Ruff configuration
# --------------------------

[tool.ruff]

line-length = 88

target-version = "py311"

exclude = [
    ".git",
    "__pycache__",
    ".venv"
]



# --------------------------
# Black configuration
# --------------------------

[tool.black]

line-length = 88

target-version = [
    "py311"
]



# --------------------------
# Pytest configuration
# --------------------------

[tool.pytest.ini_options]

pythonpath = [
    "."
]

asyncio_mode = "auto"

testpaths = [
    "tests"
]
