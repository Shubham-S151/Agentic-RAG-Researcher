version: "3.9"


services:

  # ====================================================
  # Vector Database
  # ====================================================

  qdrant:

    image: qdrant/qdrant:latest

    container_name: agentic-rag-qdrant

    restart: unless-stopped

    ports:

      - "6333:6333"

      - "6334:6334"


    volumes:

      - qdrant_storage:/qdrant/storage



    environment:

      QDRANT__SERVICE__GRPC_PORT: 6334



  # ====================================================
  # FastAPI Backend
  # ====================================================

  api:


    build:

      context: .

      dockerfile: docker/Dockerfile.api


    container_name: agentic-rag-api


    restart: unless-stopped


    ports:

      - "8000:8000"


    env_file:

      - .env


    depends_on:

      - qdrant



    volumes:

      - ./src:/app/src

      - ./data:/app/data



  # ====================================================
  # Streamlit Frontend
  # ====================================================

  streamlit:


    build:

      context: .

      dockerfile: docker/Dockerfile.streamlit



    container_name: agentic-rag-ui



    restart: unless-stopped



    ports:

      - "8501:8501"



    env_file:

      - .env



    depends_on:

      - api



volumes:


  qdrant_storage:
